# Daily DPO pipeline on serverless compute (no cluster spec = serverless).
resources:
  jobs:
    dpo_pipeline:
      name: dpo-pipeline
      description: Databricks Processing Optimization — ingest, attribute cost, categorize, AI recommend
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 30 6 * * ?"   # 06:30 daily
        timezone_id: Asia/Kolkata
        pause_status: PAUSED                     # unpause after first manual run succeeds
      tasks:
        - task_key: setup
          notebook_task:
            notebook_path: ../notebooks/00_setup.sql

        - task_key: ingest
          depends_on: [{ task_key: setup }]
          notebook_task:
            notebook_path: ${var.ingest_notebook}

        - task_key: silver_cost
          depends_on: [{ task_key: ingest }]
          notebook_task:
            notebook_path: ../notebooks/02_silver_cost.sql

        - task_key: gold_categorize
          depends_on: [{ task_key: silver_cost }]
          notebook_task:
            notebook_path: ../notebooks/03_gold_categorize.sql

        - task_key: ai_recommend
          depends_on: [{ task_key: gold_categorize }]
          notebook_task:
            notebook_path: ../notebooks/04_ai_recommend.py
            base_parameters:
              model_endpoint: databricks-meta-llama-3-3-70b-instruct
              top_n: "10"
